[project]
name = "company-policy-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Md Rayhan Ali", email = "sm.rayhanali.bd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "groq>=1.6.0",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
company-policy-assistant = "company_policy_assistant:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
